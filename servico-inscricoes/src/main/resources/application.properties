server.port=8083
spring.application.name=servico-inscricoes

# Banco de Dados SQLite
spring.datasource.url=jdbc:sqlite:inscricoes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Os demais microsservicos (usuarios-equipes, eventos, notificacoes) sao
# encontrados pelo nome no Eureka, sem URL fixa.

# Service Discovery (Eureka). No Docker, EUREKA_URL=http://service-discovery:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
