# Porta do Gateway: vem da variavel GATEWAY_PORT (definida no .env da raiz e
# repassada pelo docker-compose). Nenhum numero de porta fica no codigo.
server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Servico de Usuarios e Equipes (UC02, UC03)
        - id: usuarios-equipes
          uri: lb://servico-usuarios-equipes
          predicates:
            - Path=/api/usuarios/**,/api/equipes/**
        # Servico de Eventos (UC01, UC04)
        - id: eventos
          uri: lb://servico-eventos
          predicates:
            - Path=/api/modalidades/**,/api/eventos/**
        # Servico de Inscricoes (UC05, UC06)
        - id: inscricoes
          uri: lb://servico-inscricoes
          predicates:
            - Path=/api/inscricoes/**
        # Servico de Notificacoes (UC07)
        - id: notificacoes
          uri: lb://servico-notificacoes
          predicates:
            - Path=/notificacoes/**

eureka:
  client:
    service-url:
      # No Docker: EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/
      defaultZone: ${EUREKA_URL:http://localhost:${EUREKA_PORT}/eureka/}
  instance:
    prefer-ip-address: true
