services:
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - eventos-net

  servico-notificacoes:
    build:
      context: .
      dockerfile: servico-notificacoes/Dockerfile
    container_name: servico-notificacoes
    ports:
      - "8084:8084"
    environment:
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      - mailpit
    networks:
      - eventos-net

  servico-usuarios-equipes:
    build:
      context: .
      dockerfile: servico-usuarios-equipes/Dockerfile
    container_name: servico-usuarios-equipes
    ports:
      - "8081:8081"
    environment:
      - APP_SERVICES_NOTIFICACOES_URL=http://servico-notificacoes:8084
    depends_on:
      - servico-notificacoes
    networks:
      - eventos-net

  servico-eventos:
    build:
      context: .
      dockerfile: servico-eventos/Dockerfile
    container_name: servico-eventos
    ports:
      - "8082:8082"
    environment:
      - APP_SERVICES_USUARIOS_EQUIPES_URL=http://servico-usuarios-equipes:8081
    depends_on:
      - servico-usuarios-equipes
    networks:
      - eventos-net

  servico-inscricoes:
    build:
      context: .
      dockerfile: servico-inscricoes/Dockerfile
    container_name: servico-inscricoes
    ports:
      - "8083:8083"
    environment:
      - APP_SERVICES_USUARIOS_EQUIPES_URL=http://servico-usuarios-equipes:8081
      - APP_SERVICES_EVENTOS_URL=http://servico-eventos:8082
      - APP_SERVICES_NOTIFICACOES_URL=http://servico-notificacoes:8084
    depends_on:
      - servico-usuarios-equipes
      - servico-eventos
      - servico-notificacoes
    networks:
      - eventos-net

networks:
  eventos-net:
    driver: bridge