services:
  # Service Discovery (Eureka): cada microsservico se registra aqui pelo nome.
  # Painel em http://localhost:8761
  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile
    container_name: service-discovery
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks:
      - eventos-net

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
    networks:
      - eventos-net

  servico-notificacoes:
    build:
      context: .
      dockerfile: servico-notificacoes/Dockerfile
    container_name: servico-notificacoes
    ports:
      - "8084:8084"
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      - service-discovery
      - mailpit
    restart: unless-stopped
    networks:
      - eventos-net

  servico-usuarios-equipes:
    build:
      context: .
      dockerfile: servico-usuarios-equipes/Dockerfile
    container_name: servico-usuarios-equipes
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  servico-eventos:
    build:
      context: .
      dockerfile: servico-eventos/Dockerfile
    container_name: servico-eventos
    ports:
      - "8082:8082"
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  servico-inscricoes:
    build:
      context: .
      dockerfile: servico-inscricoes/Dockerfile
    container_name: servico-inscricoes
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

networks:
  eventos-net:
    driver: bridge
