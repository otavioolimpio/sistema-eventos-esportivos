# Todas as portas vem do arquivo .env da raiz (o compose o le sozinho).
# So api-gateway, service-discovery e mailpit publicam portas (GATEWAY_PORT,
# EUREKA_PORT e MAILPIT_WEB_PORT). Os 4 servicos de negocio sobem numa porta
# aleatoria (server.port=0), registrada no Eureka, e nao publicam nenhuma.
# Os servicos de negocio ficam acessiveis apenas dentro da rede eventos-net.
services:
  # Service Discovery (Eureka): cada microsservico se registra aqui pelo nome.
  # Painel em http://localhost:${EUREKA_PORT}
  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile
    container_name: service-discovery
    ports:
      - "${EUREKA_PORT}:${EUREKA_PORT}"
    environment:
      - EUREKA_PORT=${EUREKA_PORT}
    restart: unless-stopped
    networks:
      - eventos-net

  # API Gateway: UNICA porta de entrada da aplicacao (http://localhost:${GATEWAY_PORT}).
  # Roteia pelo nome do servico no Eureka (lb://servico-xxx).
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT}
      - EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  # Mailpit: servidor SMTP de teste + caixa de e-mail (http://localhost:${MAILPIT_WEB_PORT}).
  # As portas internas tambem vem do .env (MP_UI_BIND_ADDR e MP_SMTP_BIND_ADDR).
  # So a porta web e publicada; o SMTP fica so na rede interna.
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "${MAILPIT_WEB_PORT}:${MAILPIT_WEB_PORT}"
    environment:
      - MP_UI_BIND_ADDR=0.0.0.0:${MAILPIT_WEB_PORT}
      - MP_SMTP_BIND_ADDR=0.0.0.0:${MAILPIT_SMTP_PORT}
    restart: unless-stopped
    networks:
      - eventos-net

  servico-notificacoes:
    build:
      context: .
      dockerfile: servico-notificacoes/Dockerfile
    container_name: servico-notificacoes
    environment:
      - EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=${MAILPIT_SMTP_PORT}
    volumes:
      - notificacoes-data:/data
    depends_on:
      - service-discovery
      - mailpit
    restart: unless-stopped
    networks:
      - eventos-net

  servico-usuarios-equipes:
    build:
      context: .
      dockerfile: servico-usuarios-equipes/Dockerfile
    container_name: servico-usuarios-equipes
    environment:
      - EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/
    volumes:
      - usuarios-data:/data
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  servico-eventos:
    build:
      context: .
      dockerfile: servico-eventos/Dockerfile
    container_name: servico-eventos
    environment:
      - EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/
    volumes:
      - eventos-data:/data
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  servico-inscricoes:
    build:
      context: .
      dockerfile: servico-inscricoes/Dockerfile
    container_name: servico-inscricoes
    environment:
      - EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/
    volumes:
      - inscricoes-data:/data
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

networks:
  eventos-net:
    driver: bridge

volumes:
  usuarios-data:
  eventos-data:
  inscricoes-data:
  notificacoes-data:
