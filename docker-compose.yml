# So api-gateway (8080), service-discovery (8761) e mailpit (8025) publicam portas.
# Os servicos de negocio ficam acessiveis apenas dentro da rede eventos-net.
services:
  # Service Discovery (Eureka): cada microsservico se registra aqui pelo nome.
  # Painel em http://localhost:8761
  service-discovery:
    build:
      context: .
      dockerfile: service-discovery/Dockerfile
    container_name: service-discovery
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks:
      - eventos-net

  # API Gateway: UNICA porta de entrada da aplicacao (http://localhost:8080).
  # Roteia pelo nome do servico no Eureka (lb://servico-xxx).
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"   # caixa de e-mail (web); o SMTP 1025 fica so na rede interna
    restart: unless-stopped
    networks:
      - eventos-net

  servico-notificacoes:
    build:
      context: .
      dockerfile: servico-notificacoes/Dockerfile
    container_name: servico-notificacoes
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    depends_on:
      - service-discovery
      - mailpit
    restart: unless-stopped
    networks:
      - eventos-net

  servico-usuarios-equipes:
    build:
      context: .
      dockerfile: servico-usuarios-equipes/Dockerfile
    container_name: servico-usuarios-equipes
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  servico-eventos:
    build:
      context: .
      dockerfile: servico-eventos/Dockerfile
    container_name: servico-eventos
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

  servico-inscricoes:
    build:
      context: .
      dockerfile: servico-inscricoes/Dockerfile
    container_name: servico-inscricoes
    environment:
      - EUREKA_URL=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    restart: unless-stopped
    networks:
      - eventos-net

networks:
  eventos-net:
    driver: bridge
