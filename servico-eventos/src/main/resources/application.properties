server.port=8082
spring.application.name=servico-eventos

# Banco de Dados SQLite
spring.datasource.url=jdbc:sqlite:eventos.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Conexao com o servico de usuarios para validacao de perfil de organizador
app.services.usuarios-equipes.url=http://localhost:8081