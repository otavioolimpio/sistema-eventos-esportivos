spring.application.name=servico-notificacoes
server.port=${PORT:8084}

# Conexao SQLite (banco proprio do servico; no Docker fica no volume /data)
spring.datasource.url=jdbc:sqlite:${NOTIFICACAO_DB:notificacoes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita uma escrita por vez: uma conexao evita erros de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Servidor SMTP (por padrao, o Mailpit do docker-compose)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# Usuario e senha SMTP so sao necessarios para um servidor real (ex.: Gmail).
# Defina-os pelas variaveis SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD (veja o README).
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

notificacao.email.remetente=${MAIL_FROM:no-reply@esports.local}
notificacao.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
