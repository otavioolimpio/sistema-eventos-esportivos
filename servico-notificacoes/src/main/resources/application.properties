spring.application.name=servico-notificacoes

# Porta aleatoria (server.port=0): o sistema operacional escolhe uma porta livre
# ao subir. O cliente Eureka registra a porta REAL, e o API Gateway (lb://) e os
# clientes Feign descobrem o endereco por la. Assim nenhuma porta fica no codigo.
server.port=0
# instance-id unico: com a porta 0, o id padrao (host:nome:porta) seria igual
# para todas as instancias; o valor aleatorio evita colisao no registro do Eureka.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Conexao SQLite (banco proprio do servico; no Docker fica no volume /data)
spring.datasource.url=jdbc:sqlite:${NOTIFICACAO_DB:notificacoes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita uma escrita por vez: uma conexao evita erros de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Servidor SMTP (por padrao, o Mailpit do docker-compose)
spring.mail.host=${MAIL_HOST:localhost}
# A porta SMTP nao fica aqui: no Docker o compose define SPRING_MAIL_PORT com o
# valor de MAILPIT_SMTP_PORT (.env), e o Spring a aplica em spring.mail.port.
# Para outro servidor (ex.: Gmail), defina SPRING_MAIL_PORT (veja o README).
# Usuario e senha SMTP so sao necessarios para um servidor real (ex.: Gmail).
# Defina-os pelas variaveis SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD (veja o README).
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

notificacao.email.remetente=${MAIL_FROM:no-reply@esports.local}
notificacao.discord.webhook-url=${DISCORD_WEBHOOK_URL:}

# Service Discovery (Eureka). No Docker, o compose define
# EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/ (porta vinda do .env).
# Fora do Docker, basta definir EUREKA_PORT (ou EUREKA_URL).
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:${EUREKA_PORT}/eureka/}
eureka.instance.prefer-ip-address=true
