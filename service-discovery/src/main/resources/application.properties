spring.application.name=service-discovery
# Porta do Eureka: vem da variavel EUREKA_PORT (definida no .env da raiz e
# repassada pelo docker-compose). Nenhum numero de porta fica no codigo.
server.port=${EUREKA_PORT}

# O proprio servidor nao se registra nem busca o registro (so ha um Eureka)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
