spring.application.name=servico-usuarios-equipes

# Porta aleatoria (server.port=0): o sistema operacional escolhe uma porta livre
# ao subir. O cliente Eureka registra a porta REAL, e o API Gateway (lb://) e os
# clientes Feign descobrem o endereco por la. Assim nenhuma porta fica no codigo.
server.port=0
# instance-id unico: com a porta 0, o id padrao (host:nome:porta) seria igual
# para todas as instancias; o valor aleatorio evita colisao no registro do Eureka.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Conexao SQLite (no Docker o arquivo fica no volume /data)
spring.datasource.url=jdbc:sqlite:${USUARIOS_DB:usuarios_equipes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita uma escrita por vez: uma conexao evita erros de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Integracao com o Servico de Notificacoes (veja servico-notificacoes/CONTRATO-API.md):
# o Feign encontra o servico pelo nome (servico-notificacoes) no Eureka, sem URL fixa.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=15000

# Service Discovery (Eureka). No Docker, o compose define
# EUREKA_URL=http://service-discovery:${EUREKA_PORT}/eureka/ (porta vinda do .env).
# Fora do Docker, basta definir EUREKA_PORT (ou EUREKA_URL).
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:${EUREKA_PORT}/eureka/}
eureka.instance.prefer-ip-address=true
