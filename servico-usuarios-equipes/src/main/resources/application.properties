server.port=${PORT:8081}
spring.application.name=servico-usuarios-equipes

# Conexao SQLite (no Docker o arquivo fica no volume /data)
spring.datasource.url=jdbc:sqlite:${USUARIOS_DB:usuarios_equipes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita uma escrita por vez: uma conexao evita erros de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Integracao com o Servico de Notificacoes (veja servico-notificacoes/CONTRATO-API.md):
# o Feign encontra o servico pelo nome (servico-notificacoes) no Eureka, sem URL fixa.
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=15000

# Service Discovery (Eureka). No Docker, EUREKA_URL=http://service-discovery:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
