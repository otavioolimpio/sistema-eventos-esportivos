server.port=${PORT:8081}
spring.application.name=servico-usuarios-equipes

# Conexao SQLite (no Docker o arquivo fica no volume /data)
spring.datasource.url=jdbc:sqlite:${USUARIOS_DB:usuarios_equipes.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita uma escrita por vez: uma conexao evita erros de "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Integracao com o Servico de Notificacoes (veja servico-notificacoes/CONTRATO-API.md)
# Fora do Docker: http://localhost:8084 | No docker-compose: http://notificacoes:8084
app.services.notificacoes.url=${NOTIFICACOES_URL:http://localhost:8084}
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=15000
